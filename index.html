<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="roboto-body">
    <div class="body-container">
        <div class="header-container">
            <div class="top-header-container">
                <form action="" method="get">
                    <button>search</button>
                    <label for="search-input"></label>
                    <input class="search-input" id="search-input" name="searching" type="text">
                </form>
                <div class="he">
                    <button type="button">Notification</button>
                    <button class="profile-pic-btn" type="button"></button>
                    <span class=".roboto-bold"> Morgan Oakley</span>
                </div>
            </div>
            <div class="bottom-header-container">
                <div class="profile-container">
                    <img class="profile-img" src="gohan-img.jpg" alt="Profile Picture">
                    <span class="roboto-bold">Hi there, <span class="profile-font-large">Morgan Oakley</span> (@morgan)</span>
                </div>
                <div class="nav">
                    <ul class="nav-btns">
                        <button class="nav-btn"><li>New</li></button>
                        <button class="nav-btn"><li>Upload</li></button>
                        <button class="nav-btn"><li>Share</li></button>
                    </ul>
                </div>
            </div>
        </div>
        <!-- ############################################Leave below here for now!############################################### -->
        <div class="sidebar">
            <div>Dashboard</div>
            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Messages</li>
                <li>History</li>
                <li>Tasks</li>
                <li>Communities</li>
            </ul>
            <ul>
                <li>Settings</li>
                <li>Support</li>
                <li>Privacy</li>
            </ul>
        </div>
        <div class="main-article">

        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="roboto-body">
    <div class="body-container">

        <div class="header-container">
            <div class="top-header-container">
                <form  class="search-container" action="" method="get">
                    <button class="search-btn"></button>
                    <label for="search-input"></label>
                    <input class="search-input" id="search-input" name="searching" type="text">
                </form>
                <div class="he">
                    <button class="notification-btn"></button>
                    <button class="profile-pic-btn" type="button"></button>
                    <span class="roboto-bold"> Morgan Oakley</span>
                </div>
            </div>
            <div class="bottom-header-container">
                <div class="profile-container">
                    <img class="profile-img" src="./img/gohan-img.jpg" alt="Profile Picture">
                    <span class="roboto-bold">Hi there, <div class="profile-font-large">Morgan Oakley (@morgan)</div></span>
                </div>
                <div class="nav">
                    <ul class="nav-btns">
                        <button class="nav-btn"><li>New</li></button>
                        <button class="nav-btn"><li>Upload</li></button>
                        <button class="nav-btn"><li>Share</li></button>
                    </ul>
                </div>
            </div>
        </div>

        <div class="sidebar roboto-bold">
            <div class="sidebar-container">
                <div><img class="butterfly-logo" src="./svg/butterfly-outline.svg" alt="Butterfly logo"></div>
                <div class="dashboard-sidebar-name">Dashboard</div>

                <div class="margin-sidebar-top"><img class="sidebar-logo" src="./svg/home.svg" alt="Home logo"></div>
                <div class="margin-sidebar-top">Home</div>

                <div><img class="sidebar-logo" src="./svg/account.svg" alt="Profile logo"></div>
                <div>Profile</div>

                <div><img class="sidebar-logo" src="./svg/message.svg" alt="Message logo"></div>
                <div>Messages</div>

                <div><img class="sidebar-logo" src="./svg/clock-time-four.svg" alt="History logo"></div>
                <div>History</div>

                <div><img class="sidebar-logo" src="./svg/note-multiple.svg" alt="Notes logo"></div>
                <div>Tasks</div>

                <div><img class="sidebar-logo" src="./svg/account-group.svg" alt="Communities logo"></div>
                <div>Communities</div>

                <div class="margin-sidebar-top"><img class="sidebar-logo" src="./svg/cog.svg" alt="Settings logo"></div>
                <div class="margin-sidebar-top">Settings</div>

                <div><img class="sidebar-logo" src="./svg/help-circle.svg" alt="Support logo"></div>
                <div>Support</div>

                <div><img class="sidebar-logo" src="./svg/shield-check.svg" alt="Privacy logo"></div>
                <div>Privacy</div>
                
                <!-- <ul>
                    <li>Home</li>
                    <li>Profile</li>
                    <li>Messages</li>
                    <li>History</li>
                    <li>Tasks</li>
                    <li>Communities</li>
                </ul>
                <ul>
                    <li>Settings</li>
                    <li>Support</li>
                    <li>Privacy</li>
                </ul> -->
            </div>
        </div>

        <div class="main-article">

        </div>
    </div>
</body>
</html>
